[project]
name = "callguard"
version = "0.1.0"
description = "Live call security: synthetic-voice detection (Hearsay) + keystroke-leak shield (Keyguard) with a threat dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch>=2.4",
    "transformers>=4.44",
    "lightgbm>=4.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "httpx>=0.27",
    "sounddevice>=0.4.7",
    "soundcard>=0.4.3",
    "pynput>=1.7.7",
    "pystoi>=0.4",
    "matplotlib>=3.11.2",
    "pesq>=0.0.4",
    "praat-parselmouth>=0.4.7",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
callguard = "app.source.cli:main"

[tool.uv]
dev-dependencies = ["pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["app", "dashboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
